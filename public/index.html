<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLSE 成交量异动追踪</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#131a26; --panel2:#0f1621; --border:#1f2a3a;
    --text:#e6edf3; --dim:#8b98a9; --accent:#3b82f6; --green:#22c55e;
    --red:#ef4444; --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;font-size:14px}
  .wrap{max-width:1200px;margin:0 auto;padding:20px}
  h1{font-size:20px;margin:0;display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block}
  .dot.open{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.closed{background:#555}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .meta{color:var(--dim);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .panel h2{font-size:14px;margin:0 0 12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  button.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  button.danger{background:transparent;border:1px solid var(--border);color:var(--dim);padding:2px 8px;font-size:12px}
  button.danger:hover{color:var(--red);border-color:var(--red)}
  button:hover{opacity:.9}
  input,select{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  tr:hover td{background:var(--panel2)}
  .code{font-family:ui-monospace,Consolas,monospace;color:var(--accent)}
  .up{color:var(--green)} .down{color:var(--red)}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .badge.alert{background:rgba(239,68,68,.15);color:var(--red)}
  .badge.ok{background:rgba(34,197,94,.12);color:var(--green)}
  .badge.low,.badge.nodata{background:var(--panel2);color:var(--dim)}
  .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  .field input,.field select{width:100%}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .alerts{max-height:260px;overflow-y:auto}
  .alert-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:13px}
  .alert-item .t{color:var(--dim);font-size:12px;min-width:70px}
  .spark{color:var(--amber);font-weight:600}
  .grow{flex:1}
  #toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:12px 16px;display:none;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:99}
  a{color:var(--accent)}
  .muted{color:var(--dim);font-size:12px}

  /* 快捷控制条 */
  .quick{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .qlabel{color:var(--dim);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
  .seg button{background:transparent;color:var(--dim);border:0;border-radius:7px;padding:6px 13px;cursor:pointer;font-size:13px}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--accent);color:#fff}
  .seg.surge button.on{background:var(--green)}
  .seg.drop button.on{background:var(--red)}
  #quickThr{width:88px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot" id="statusDot"></span> KLSE 成交量异动追踪</h1>
    <div class="meta" id="metaBar">载入中…</div>
    <div class="row">
      <button class="ghost" onclick="doPoll()">🔄 立即抓取</button>
      <button class="ghost" onclick="toggleSettings()">⚙ 高级设置</button>
      <button class="ghost" onclick="requestNotify()">🔔 通知</button>
    </div>
  </header>

  <div class="panel">
    <div class="quick">
      <span class="qlabel">对比时段</span>
      <div class="seg" id="winSeg">
        <button data-w="10m">10分钟</button>
        <button data-w="30m">30分钟</button>
        <button data-w="1h">1小时</button>
        <button data-w="2h">2小时</button>
        <button data-w="5h">5小时</button>
        <button data-w="1d">1天</button>
      </div>
      <span class="qlabel">阈值</span>
      <input type="number" id="quickThr" min="0" step="5" title="当前时段量达到上一时段量的该百分比时提醒">
      <span style="color:var(--dim)">%</span>
      <span class="qlabel">方向</span>
      <div class="seg" id="dirSeg">
        <button data-d="surge">📈 放量 ≥</button>
        <button data-d="drop">📉 缩量 ≤</button>
      </div>
    </div>
    <div class="muted" style="margin-top:10px">
      当「当前时段量」达到「上一时段量」的阈值 % 时提醒。1 天模式 = 今日累计 vs 前一交易日。
    </div>
  </div>

  <div class="panel" id="settingsPanel" style="display:none">
    <h2>高级设置</h2>
    <div class="settings">
      <div class="field"><label>轮询间隔(分)</label><input type="number" id="setPoll" min="1" step="1"></div>
      <div class="field"><label>上一时段最小量</label><input type="number" id="setMinVol" min="0" step="1000"></div>
      <div class="field"><label>重复提醒间隔(分)</label><input type="number" id="setCooldown" min="1" step="1"></div>
      <div class="field"><label>Telegram Bot Token <span class="muted">(可选)</span></label><input type="text" id="setToken" placeholder="可选"></div>
      <div class="field"><label>Telegram Chat ID <span class="muted">(可选)</span></label><input type="text" id="setChat" placeholder="可选"></div>
      <div><button onclick="saveAdvanced()">保存</button></div>
    </div>
    <div class="muted" style="margin-top:10px">
      对比时段、阈值、方向在顶部快捷条里改。轮询间隔是多久抓一次数据（默认 10 分钟）；「上一时段最小量」低于此值的股票不提醒（过滤冷门股）。
    </div>
  </div>

  <div class="panel">
    <h2>自选股 <span class="muted" id="wlCount"></span></h2>
    <div class="row" style="margin-bottom:12px">
      <input id="addCode" placeholder="股票代码, 如 1155" style="width:160px">
      <button onclick="addStock()">添加</button>
      <span class="muted">马股代码纯数字, 后端自动加 .KL 后缀</span>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>代码</th><th>名称</th><th>现价</th>
          <th>当前时段量</th><th>上一时段量</th><th>比率</th><th>状态</th><th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <h2>告警记录</h2>
    <div class="alerts" id="alerts"><div class="muted">暂无告警</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let lastAlertId = 0;
let state = null;

function fmt(n){
  if(n==null) return '—';
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}
function fmtTime(ts){
  if(!ts) return '—';
  const d=new Date(ts*1000);
  return d.toLocaleTimeString('zh-CN',{hour12:false});
}

async function refresh(){
  try{
    const r = await fetch('/api/state');
    state = await r.json();
    render();
    checkNewAlerts();
  }catch(e){ $('metaBar').textContent = '连接失败, 重试中…'; }
}

function renderQuickBar(){
  if(!state) return;
  const s = state.settings;
  document.querySelectorAll('#winSeg button').forEach(b => {
    b.classList.toggle('on', b.dataset.w === s.window);
  });
  document.querySelectorAll('#dirSeg button').forEach(b => {
    b.classList.toggle('on', b.dataset.d === s.direction);
  });
  $('dirSeg').className = 'seg ' + s.direction;
  if(document.activeElement !== $('quickThr')) $('quickThr').value = s.threshold_percent;
}

function render(){
  const s = state;
  renderQuickBar();
  const open = s.status.market_open;
  $('statusDot').className = 'dot ' + (open ? 'open' : 'closed');
  const lastPoll = s.status.last_poll ? fmtTime(s.status.last_poll) : '首次抓取中…';
  $('metaBar').innerHTML = `${open ? '🟢 市场开市' : '⚪ 市场休市'} · 最后更新 ${lastPoll}` +
    (s.status.polling ? ' · <span class="spark">抓取中…</span>' : '');
  $('wlCount').textContent = `(${s.watchlist.length} 只)`;

  const rows = s.stocks.map(st => {
    let statusHtml = '<span class="badge nodata">无数据</span>';
    if(st.status==='alert') statusHtml = '<span class="badge alert">⚠ 异动</span>';
    else if(st.status==='ok') statusHtml = '<span class="badge ok">正常</span>';
    else if(st.status==='low') statusHtml = '<span class="badge low">量少</span>';
    const ratioHtml = st.ratio==null ? '—' :
      `<span class="${s.settings.direction==='surge' ? (st.ratio>=s.settings.threshold_percent?'up':'') : (st.ratio<=s.settings.threshold_percent?'down':'')}">${st.ratio.toFixed(1)}%</span>`;
    return `<tr>
      <td><span class="code">${st.code}.KL</span></td>
      <td>${st.name}</td>
      <td>${st.price!=null?st.price.toFixed(3):'—'}</td>
      <td>${fmt(st.current)}</td>
      <td>${fmt(st.previous)}</td>
      <td>${ratioHtml}</td>
      <td>${statusHtml}</td>
      <td><button class="danger" onclick="removeStock('${st.code}')">✕</button></td>
    </tr>`;
  }).join('');
  $('tbody').innerHTML = rows || '<tr><td colspan="8" class="muted">暂无股票</td></tr>';

  const alerts = s.alerts.map(a => {
    const dir = a.direction==='surge' ? '📈 放量' : '📉 缩量';
    return `<div class="alert-item">
      <span class="t">${fmtTime(a.ts)}</span>
      <span class="code">${a.stock}.KL</span>
      <span>${a.name}</span>
      <span class="grow muted">时段 ${a.window} · ${fmt(a.current)} / ${fmt(a.previous)}</span>
      <span class="spark">${a.ratio.toFixed(1)}%</span>
      <span>${dir}</span>
    </div>`;
  }).join('');
  $('alerts').innerHTML = alerts || '<div class="muted">暂无告警</div>';
}

function checkNewAlerts(){
  if(!state || !state.alerts.length) return;
  const newest = state.alerts[0];
  if(newest.id > lastAlertId){
    if(lastAlertId !== 0) notify(newest);
    lastAlertId = newest.id;
  }
}

function notify(a){
  const dir = a.direction==='surge' ? '📈 放量' : '📉 缩量';
  const title = `${dir}提醒 — ${a.name} (${a.stock}.KL)`;
  const body = `时段 ${a.window}: 当前 ${fmt(a.current)} / 上一时段 ${fmt(a.previous)} = ${a.ratio.toFixed(1)}%`;
  if(Notification && Notification.permission === 'granted') new Notification(title, {body});
  beep();
  showToast(title + '<br>' + body);
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.3);
    o.start(); o.stop(ctx.currentTime+0.3);
  }catch(e){}
}

function showToast(html){
  const t = $('toast');
  t.innerHTML = html; t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 5000);
}

function requestNotify(){
  if(!('Notification' in window)){ alert('此浏览器不支持通知'); return; }
  Notification.requestPermission().then(p=>{
    showToast(p==='granted' ? '✅ 已开启网页通知' : '通知权限被拒绝, 可改用 Telegram');
  });
}

async function setSetting(patch, msg){
  await fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch)});
  if(msg) showToast('✅ ' + msg);
  lastAlertId = 0;   // 重置告警增量检测, 避免切换时段后旧告警触发通知
  refresh();
}

// 快捷条事件
$('winSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  setSetting({window: b.dataset.w}, '对比时段已切到 ' + b.dataset.w);
});
$('dirSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  setSetting({direction: b.dataset.d}, b.dataset.d==='surge' ? '已切到放量提醒' : '已切到缩量提醒');
});
$('quickThr').addEventListener('change', () => {
  const v = parseFloat($('quickThr').value);
  if(isNaN(v) || v < 0) return;
  setSetting({threshold_percent: v}, '阈值已设为 ' + v + '%');
});
$('quickThr').addEventListener('keydown', e => { if(e.key==='Enter') $('quickThr').blur(); });

function toggleSettings(){
  const p = $('settingsPanel');
  const show = p.style.display === 'none';
  p.style.display = show ? 'block' : 'none';
  if(show && state){
    const s = state.settings;
    $('setPoll').value = s.poll_interval_minutes;
    $('setMinVol').value = s.min_previous_volume;
    $('setCooldown').value = s.cooldown_minutes;
    $('setToken').value = s.telegram_bot_token || '';
    $('setChat').value = s.telegram_chat_id || '';
  }
}

async function saveAdvanced(){
  const body = {
    poll_interval_minutes: parseInt($('setPoll').value) || 10,
    min_previous_volume: parseInt($('setMinVol').value) || 0,
    cooldown_minutes: parseInt($('setCooldown').value) || 30,
    telegram_bot_token: $('setToken').value.trim(),
    telegram_chat_id: $('setChat').value.trim(),
  };
  await fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  showToast('✅ 高级设置已保存');
  refresh();
}

async function addStock(){
  const code = $('addCode').value.trim();
  if(!code){ return; }
  const r = await fetch('/api/watchlist/add', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code})});
  const d = await r.json();
  if(d.error){ showToast('⚠ ' + d.error); return; }
  showToast(d.dup ? '已在列表中' : `✅ 已添加 ${d.name||code}`);
  $('addCode').value = '';
  refresh();
}

async function removeStock(code){
  await fetch('/api/watchlist/remove', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code})});
  refresh();
}

async function doPoll(){
  $('metaBar').innerHTML = '手动抓取中…';
  await fetch('/api/poll', {method:'POST'});
  setTimeout(refresh, 3000);
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
